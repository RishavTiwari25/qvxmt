# Fallback deployment: Render.com blueprint (two services behind one rewrite).
# `render.com/deploy` reads this file; the frontend proxies /api/* to the backend.
services:
  - type: web
    name: qvxmt-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health

  - type: web
    name: qvxmt-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://qvxmt-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
